<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" width="100%" role="img" aria-label="Domains placed on a verifier axis by how many of the three properties (exact, automatic, cheap) their ground-truth check has. Math and code have all three and discovery is fast. Materials has exact and automatic but not cheap. Open-ended science has only exactness. Robotics and biology have none, and discovery stalls." preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    svg { --fig-text: var(--text, #1a1a1a); }
    @media (prefers-color-scheme: dark) { svg { --fig-text: var(--text, #e8e8ea); } }
    .ttl { fill: var(--fig-text); font-weight: 500; }
    .mut { fill: var(--fig-text); opacity: .58; }
    .nm  { fill: var(--fig-text); font-weight: 600; }
    .cn  { stroke: var(--fig-text); stroke-opacity: .28; stroke-width: 1.2; }
  </style>
  <defs>
    <linearGradient id="axg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa2ad"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <g id="s-full"><circle r="5" fill="#0d9488"/></g>
    <g id="s-none"><circle r="5" fill="none" stroke="var(--fig-text)" stroke-opacity=".34" stroke-width="1.3"/></g>
  </defs>
  <text class="ttl" x="24" y="30" font-size="16.5">Where each domain sits on the verifier axis</text>
  <text class="mut" x="24" y="52" font-size="12">position is how many of the three the check has: exact, automatic, cheap</text>
  <rect x="90" y="212" width="560" height="9" rx="4.5" fill="url(#axg)"/>
  <text class="mut" x="90" y="240" font-size="11.5">no verifier</text>
  <text x="650" y="240" font-size="11.5" text-anchor="end" fill="#0d9488" font-weight="600">full verifier</text>

  <!-- Robotics and biology (none) : above, far left -->
  <line class="cn" x1="115" y1="182" x2="115" y2="212"/>
  <text class="nm" x="115" y="130" font-size="13" text-anchor="middle">Robotics, biology</text>
  <use href="#s-none" x="97" y="153"/><use href="#s-none" x="115" y="153"/><use href="#s-none" x="133" y="153"/>
  <text class="mut" x="115" y="176" font-size="11.5" text-anchor="middle">stalled</text>
  <circle cx="115" cy="216.5" r="5.5" fill="#9aa2ad"/>

  <!-- Open-ended science (exact only) : below -->
  <circle cx="290" cy="216.5" r="5.5" fill="#9aa2ad"/>
  <line class="cn" x1="290" y1="221" x2="290" y2="238"/>
  <text class="nm" x="290" y="258" font-size="13" text-anchor="middle">Open-ended science</text>
  <use href="#s-full" x="272" y="278"/><use href="#s-none" x="290" y="278"/><use href="#s-none" x="308" y="278"/>
  <text class="mut" x="290" y="300" font-size="11.5" text-anchor="middle">stalled</text>

  <!-- Materials (exact + automatic) : above -->
  <line class="cn" x1="463" y1="182" x2="463" y2="212"/>
  <text class="nm" x="463" y="130" font-size="13" text-anchor="middle">Materials</text>
  <use href="#s-full" x="445" y="153"/><use href="#s-full" x="463" y="153"/><use href="#s-none" x="481" y="153"/>
  <text x="463" y="176" font-size="11.5" text-anchor="middle" fill="#d99a2b" font-weight="600">emerging</text>
  <circle cx="463" cy="216.5" r="5.5" fill="#d99a2b"/>

  <!-- Math and code (all three) : above, far right -->
  <line class="cn" x1="635" y1="182" x2="635" y2="212"/>
  <text class="nm" x="635" y="130" font-size="13" text-anchor="middle">Math and code</text>
  <use href="#s-full" x="617" y="153"/><use href="#s-full" x="635" y="153"/><use href="#s-full" x="653" y="153"/>
  <text x="635" y="176" font-size="11.5" text-anchor="middle" fill="#0d9488" font-weight="600">fast</text>
  <circle cx="635" cy="216.5" r="5.5" fill="#0d9488"/>

  <text class="mut" x="24" y="334" font-size="12.5">Discovery tracks how many of the three a domain has. Math and code have all three, materials two,</text>
  <text class="mut" x="24" y="352" font-size="12.5">open-ended science only exactness, and robotics none. The check runs out before the physical world.</text>
  <g transform="translate(24,380)">
    <use href="#s-full" x="6" y="0"/><text class="mut" x="17" y="4" font-size="11.5">present</text>
    <g transform="translate(96,0)"><use href="#s-none" x="6" y="0"/><text class="mut" x="17" y="4" font-size="11.5">missing</text></g>
    <text class="mut" x="200" y="4" font-size="11.5">each triple = exact &#183; automatic &#183; cheap</text>
  </g>
</svg>
