<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 360" width="100%" role="img" aria-labelledby="sc-title sc-desc" preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="sc-title">A cheap verifier turns a search into a hill-climb</title>
  <desc id="sc-desc">Left to right, a wide scatter of candidate answers is pruned round by round by a verifier, so the surviving points concentrate and move toward a single verified answer on the right. The wide cloud funnels down to one point.</desc>
  <style>
    svg { --fig-text: var(--text, #1a1a1a); }
    @media (prefers-color-scheme: dark) { svg { --fig-text: var(--text, #e8e8ea); } }
    .mut { fill: var(--fig-text); opacity: .6; }
    .lab { fill: var(--fig-text); opacity: .82; font-weight: 500; }
    .dm { fill: var(--fig-text); opacity: .30; }
    .dg { fill: var(--fig-text); opacity: .12; }
    .da { fill: #0d9488; }
  </style>
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>

  <!-- round labels -->
  <text class="mut" x="95"  y="52" font-size="12" text-anchor="middle">Round 0</text>
  <text class="mut" x="250" y="52" font-size="12" text-anchor="middle">Round 1</text>
  <text class="mut" x="405" y="52" font-size="12" text-anchor="middle">Round 2</text>
  <text class="mut" x="560" y="52" font-size="12" text-anchor="middle">Verified</text>

  <!-- funnel envelope -->
  <path d="M60,92 C230,112 400,144 585,154 L585,168 C400,178 230,208 60,228 Z" fill="#0d9488" fill-opacity="0.07"/>

  <!-- climb arrow -->
  <line x1="132" y1="168" x2="545" y2="161" stroke="#0d9488" stroke-opacity="0.65" stroke-width="2" marker-end="url(#arw)"/>

  <!-- ghosted pruned -->
  <circle class="dg" cx="150" cy="108" r="4"/><circle class="dg" cx="164" cy="238" r="4"/>
  <circle class="dg" cx="308" cy="118" r="4"/><circle class="dg" cx="318" cy="226" r="4"/>
  <circle class="dg" cx="452" cy="140" r="4"/>

  <!-- Round 0 : wide scatter, mostly unverified -->
  <circle class="dm" cx="68"  cy="110" r="4"/><circle class="dm" cx="92"  cy="124" r="4"/>
  <circle class="da" cx="74"  cy="146" r="4"/><circle class="dm" cx="108" cy="138" r="4"/>
  <circle class="dm" cx="66"  cy="168" r="4"/><circle class="da" cx="98"  cy="176" r="4"/>
  <circle class="dm" cx="82"  cy="196" r="4"/><circle class="dm" cx="112" cy="206" r="4"/>
  <circle class="dm" cx="72"  cy="216" r="4"/><circle class="dm" cx="102" cy="110" r="4"/>
  <circle class="da" cx="88"  cy="158" r="4"/><circle class="dm" cx="116" cy="184" r="4"/>
  <circle class="dm" cx="80"  cy="128" r="4"/><circle class="dm" cx="96"  cy="200" r="4"/>
  <circle class="dm" cx="70"  cy="186" r="4"/><circle class="da" cx="110" cy="160" r="4"/>

  <!-- Round 1 : narrower, more survive -->
  <circle class="dm" cx="232" cy="138" r="4"/><circle class="da" cx="256" cy="150" r="4"/>
  <circle class="da" cx="238" cy="168" r="4"/><circle class="dm" cx="262" cy="182" r="4"/>
  <circle class="dm" cx="244" cy="128" r="4"/><circle class="da" cx="254" cy="192" r="4"/>
  <circle class="da" cx="248" cy="164" r="4"/><circle class="da" cx="260" cy="142" r="4"/>

  <!-- Round 2 : tight cluster -->
  <circle class="da" cx="392" cy="152" r="4"/><circle class="da" cx="414" cy="164" r="4"/>
  <circle class="da" cx="398" cy="176" r="4"/><circle class="da" cx="418" cy="152" r="4"/>
  <circle class="dm" cx="404" cy="170" r="4"/>

  <!-- Verified answer -->
  <circle cx="560" cy="161" r="10" fill="none" stroke="#0d9488" stroke-width="2"/>
  <circle cx="560" cy="161" r="4.5" fill="#0d9488"/>

  <!-- labels -->
  <text class="lab" x="40" y="262" font-size="12.5">many candidates</text>
  <text class="mut" x="40" y="279" font-size="11.5">pass@k high, pass@1 low</text>
  <text class="lab" x="560" y="205" font-size="12.5" text-anchor="middle">verified answer</text>
  <text class="mut" x="560" y="222" font-size="11.5" text-anchor="middle">pass@1 high</text>

  <!-- caption -->
  <text class="mut" x="24" y="320" font-size="12.5">A cheap verifier prunes every failed attempt, so each round the model's outputs concentrate</text>
  <text class="mut" x="24" y="338" font-size="12.5">toward what checks out. The search becomes a climb.</text>
</svg>
