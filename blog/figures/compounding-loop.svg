<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" role="img" aria-label="A rising staircase of model capability over training rounds. With a cheap verifier, each round turns the model's verified wins into training data so the next model starts higher and capability compounds. Without a verifier the line stays flat." preserveAspectRatio="xMidYMid meet" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    svg { --fig-text: var(--text, #1a1a1a); }
    @media (prefers-color-scheme: dark) { svg { --fig-text: var(--text, #e8e8ea); } }
    .ttl { fill: var(--fig-text); font-weight: 500; }
    .mut { fill: var(--fig-text); opacity: .58; }
  </style>
  <defs>
    <marker id="cup" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#0d9488"/></marker>
  </defs>

  <text class="ttl" x="24" y="30" font-size="16.5">Where a verifier exists, the loop compounds</text>

  <!-- capability axis hint -->
  <line x1="70" y1="268" x2="70" y2="86" stroke="var(--fig-text)" stroke-opacity=".22" stroke-width="1" marker-end="url(#cup)"/>
  <text class="mut" x="76" y="90" font-size="11">model capability</text>
  <!-- baseline -->
  <line x1="70" y1="268" x2="646" y2="268" stroke="var(--fig-text)" stroke-opacity=".22" stroke-width="1"/>

  <!-- flat: no verifier -->
  <line x1="120" y1="243" x2="612" y2="243" stroke="#9aa2ad" stroke-width="1.6" stroke-dasharray="5 4" opacity=".7"/>
  <text x="610" y="236" font-size="11.5" text-anchor="end" fill="#9aa2ad">without a verifier, capability stays flat</text>

  <!-- drop lines -->
  <g stroke="#0d9488" stroke-opacity=".22" stroke-width="1.5">
    <line x1="120" y1="243" x2="120" y2="268"/><line x1="268" y1="203" x2="268" y2="268"/><line x1="416" y1="160" x2="416" y2="268"/><line x1="560" y1="116" x2="560" y2="268"/>
  </g>

  <!-- rising trajectory: capability compounds -->
  <path d="M120,243 L268,203 L416,160 L560,116" fill="none" stroke="#0d9488" stroke-width="2.6" marker-end="url(#cup)"/>
  <circle cx="120" cy="243" r="6" fill="#0d9488"/><circle cx="268" cy="203" r="6" fill="#0d9488"/><circle cx="416" cy="160" r="6" fill="#0d9488"/><circle cx="560" cy="116" r="6" fill="#0d9488"/>

  <!-- per-step driver labels -->
  <text x="194" y="212" font-size="10.5" text-anchor="middle" fill="#0d9488">verify + train</text>
  <text x="342" y="169" font-size="10.5" text-anchor="middle" fill="#0d9488">verify + train</text>
  <text x="488" y="126" font-size="10.5" text-anchor="middle" fill="#0d9488">verify + train</text>

  <!-- round labels -->
  <text class="mut" x="120" y="288" font-size="11.5" text-anchor="middle">base model</text>
  <text class="mut" x="268" y="288" font-size="11.5" text-anchor="middle">round 1</text>
  <text class="mut" x="416" y="288" font-size="11.5" text-anchor="middle">round 2</text>
  <text class="mut" x="560" y="288" font-size="11.5" text-anchor="middle">round 3</text>

  <!-- caption -->
  <text class="mut" x="24" y="316" font-size="12.5">Each round the verifier turns the model's own verified wins into training data, so the next model</text>
  <text class="mut" x="24" y="333" font-size="12.5">starts higher. Remove the verifier and there is no loop, and the line never lifts off the floor.</text>
</svg>
