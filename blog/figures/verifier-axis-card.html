<!doctype html><html><head><meta charset="utf-8"><style>
  :root { --text:#e9edf3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:675px; }
  body {
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    background:radial-gradient(1200px 700px at 80% -10%, #16202a 0%, #0e1116 55%);
    color:var(--text);
  }
  .accent { position:absolute; left:0; top:0; width:100%; height:6px; background:linear-gradient(90deg,#9aa2ad,#0d9488); }
  .wrap { width:1200px; height:675px; padding:52px 70px 44px; display:flex; flex-direction:column; }
  .eyebrow { color:#3fbfae; font-size:15px; font-weight:600; letter-spacing:2.5px; }
  .fig { flex:1; display:flex; align-items:center; justify-content:center; }
  .fig svg { width:1030px; height:auto; }
  .foot { display:flex; justify-content:space-between; align-items:center; font-size:17px; }
  .foot .site { color:#3fbfae; font-weight:600; }
  .foot .tag { color:#7f8a99; }
</style></head><body>
  <div class="accent"></div>
  <div class="wrap">
    <div class="eyebrow">IN SEARCH OF A VERIFIER · AMAN SHARMA</div>
    <div class="fig">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" role="img" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
        <style>
          svg { --fig-text: var(--text, #e8e8ea); }
          .ttl { fill: var(--fig-text); font-weight: 500; }
          .mut { fill: var(--fig-text); opacity: .6; }
          .nm  { fill: var(--fig-text); font-weight: 600; }
          .cn  { stroke: var(--fig-text); stroke-opacity: .28; stroke-width: 1.2; }
        </style>
        <defs>
          <linearGradient id="axg2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa2ad"/><stop offset="1" stop-color="#0d9488"/></linearGradient>
          <g id="f-full"><circle r="5" fill="#0d9488"/></g>
          <g id="f-none"><circle r="5" fill="none" stroke="var(--fig-text)" stroke-opacity=".34" stroke-width="1.3"/></g>
        </defs>
        <text class="ttl" x="24" y="30" font-size="16.5">Where each domain sits on the verifier axis</text>
        <text class="mut" x="24" y="52" font-size="12">position is how many of the three the check has: exact, automatic, cheap</text>
        <rect x="90" y="212" width="560" height="9" rx="4.5" fill="url(#axg2)"/>
        <text class="mut" x="90" y="240" font-size="11.5">no verifier</text>
        <text x="650" y="240" font-size="11.5" text-anchor="end" fill="#2fb3a3" font-weight="600">full verifier</text>
        <line class="cn" x1="115" y1="182" x2="115" y2="212"/>
        <text class="nm" x="115" y="130" font-size="13" text-anchor="middle">Robotics, biology</text>
        <use href="#f-none" x="97" y="153"/><use href="#f-none" x="115" y="153"/><use href="#f-none" x="133" y="153"/>
        <text class="mut" x="115" y="176" font-size="11.5" text-anchor="middle">stalled</text>
        <circle cx="115" cy="216.5" r="5.5" fill="#9aa2ad"/>
        <circle cx="290" cy="216.5" r="5.5" fill="#9aa2ad"/>
        <line class="cn" x1="290" y1="221" x2="290" y2="238"/>
        <text class="nm" x="290" y="258" font-size="13" text-anchor="middle">Open-ended science</text>
        <use href="#f-full" x="272" y="278"/><use href="#f-none" x="290" y="278"/><use href="#f-none" x="308" y="278"/>
        <text class="mut" x="290" y="300" font-size="11.5" text-anchor="middle">stalled</text>
        <line class="cn" x1="463" y1="182" x2="463" y2="212"/>
        <text class="nm" x="463" y="130" font-size="13" text-anchor="middle">Materials</text>
        <use href="#f-full" x="445" y="153"/><use href="#f-full" x="463" y="153"/><use href="#f-none" x="481" y="153"/>
        <text x="463" y="176" font-size="11.5" text-anchor="middle" fill="#e0a63a" font-weight="600">emerging</text>
        <circle cx="463" cy="216.5" r="5.5" fill="#d99a2b"/>
        <line class="cn" x1="635" y1="182" x2="635" y2="212"/>
        <text class="nm" x="635" y="130" font-size="13" text-anchor="middle">Math and code</text>
        <use href="#f-full" x="617" y="153"/><use href="#f-full" x="635" y="153"/><use href="#f-full" x="653" y="153"/>
        <text x="635" y="176" font-size="11.5" text-anchor="middle" fill="#2fb3a3" font-weight="600">fast</text>
        <circle cx="635" cy="216.5" r="5.5" fill="#0d9488"/>
        <text class="mut" x="24" y="334" font-size="12.5">Discovery tracks how many of the three a domain has. Math and code have all three, materials two,</text>
        <text class="mut" x="24" y="352" font-size="12.5">open-ended science only exactness, and robotics none. The check runs out before the physical world.</text>
        <g transform="translate(24,380)">
          <use href="#f-full" x="6" y="0"/><text class="mut" x="17" y="4" font-size="11.5">present</text>
          <g transform="translate(96,0)"><use href="#f-none" x="6" y="0"/><text class="mut" x="17" y="4" font-size="11.5">missing</text></g>
          <text class="mut" x="200" y="4" font-size="11.5">each triple = exact &#183; automatic &#183; cheap</text>
        </g>
      </svg>
    </div>
    <div class="foot"><span class="site">arcaman07.com</span><span class="tag">@arcaman07</span></div>
  </div>
</body></html>
